name: StockFlow CI

# Verify backend and Android modules compile and that automated tests pass.
on:
  push:
    branches:
      - master
      - final-poe
  pull_request:
    branches:
      - master
      - final-poe

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest

    # Disposable database for ShopOwnershipMigrationPostgresTest; each test creates and drops
    # its own sf_migtest_* database. Never point these variables at a real database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STOCKFLOW_PG_TEST_URL: jdbc:postgresql://localhost:5432/postgres
      STOCKFLOW_PG_TEST_USER: postgres
      STOCKFLOW_PG_TEST_PASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Matches gradle/gradle-daemon-jvm.properties (toolchainVersion=21).
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Compiles the Ktor backend, runs unit tests (including the PostgreSQL migration suite
      # against the service container above), and packages the module.
      - name: Build and test backend
        run: ./gradlew :backend:build --stacktrace

      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          if-no-files-found: ignore

  android:
    name: Android unit tests and debug build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Matches gradle/gradle-daemon-jvm.properties (toolchainVersion=21).
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Default packages ("tools platform-tools") fail because legacy "tools" is deprecated
      # (android-actions/setup-android#537). Install platform-tools only, then platform/build-tools.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android platform and build-tools
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          test -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms/android-36"
          test -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Android test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
